version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: chatterbot-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  chatterbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatterbot-app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/chatterbot
      - JWT_SECRET=change-me-in-production-1234567890
      - FRONTEND_URL=http://localhost:5000
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo-data:
